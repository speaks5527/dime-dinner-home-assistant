name: Dime Dinner
version: "1.0.0"
slug: dime_dinner
description: >-
  Meal planner, recipe box, grocery list and pantry for Home Assistant. Browse
  Eating on a Dime, import recipes from any public recipe page, plan lunch and
  dinner for the week, and build a grocery list that respects your pantry.
url: https://github.com/dime-dinner/dime-dinner
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 5000
ingress_stream: false
panel_icon: mdi:silverware-fork-knife
panel_title: Dime Dinner
panel_admin: false
map:
  - addon_config:rw
options:
  kroger_enabled: false
  kroger_client_id: ""
  kroger_client_secret: ""
  kroger_zip: ""
  kroger_location_id: ""
  lunch_time: "12:00"
  dinner_time: "18:00"
  timezone: ""
schema:
  kroger_enabled: bool
  kroger_client_id: str?
  kroger_client_secret: password?
  kroger_zip: str?
  kroger_location_id: str?
  lunch_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  dinner_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  timezone: str?
