name: Dime Dinner
version: "1.2.0"
slug: dime_dinner
description: >-
  Meal planner, recipe box, grocery list and pantry for Home Assistant. Browse
  Eating on a Dime, import recipes from any public recipe page or from a PDF
  cookbook (scanned ones included), plan lunch and dinner for the week, and
  build a grocery list that respects your pantry.
url: https://github.com/speaks5527/dime-dinner-home-assistant
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 5000
ingress_stream: false
panel_icon: mdi:silverware-fork-knife
panel_title: Dime Dinner
panel_admin: false
# The app itself stays ingress-only. This single published port serves nothing
# but the Kroger OAuth redirect path, because a Home Assistant ingress URL
# carries a rotating session token and so can never be registered as a static
# OAuth callback. Set it to nothing to disable connecting a Kroger account;
# everything else in the add-on keeps working.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Kroger sign-in redirect only — no app, API or data is served here
map:
  - addon_config:rw
options:
  kroger_enabled: false
  kroger_client_id: ""
  kroger_client_secret: ""
  kroger_zip: ""
  kroger_location_id: ""
  kroger_redirect_uri: ""
  lunch_time: "12:00"
  dinner_time: "18:00"
  timezone: ""
schema:
  kroger_enabled: bool
  kroger_client_id: str?
  kroger_client_secret: password?
  kroger_zip: str?
  kroger_location_id: str?
  kroger_redirect_uri: str?
  lunch_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  dinner_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  timezone: str?
